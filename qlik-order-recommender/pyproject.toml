[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qlik-order-recommender"
version = "0.1.0"
description = "Qlik satis/fatura raporlarindan bayi bazli AI destekli hedef ve ikna onerisi"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
